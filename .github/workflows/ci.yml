name: CI

on:
  push:
    branches: [ main, stub-test ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1-5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest flake8

      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120

      - name: Run stub tests (stub-test branch)
        if: github.ref == 'refs/heads/stub-test'
        run: pytest -v -m "stub"

      - name: Run all tests (main + schedule)
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        run: pytest tests/ -v